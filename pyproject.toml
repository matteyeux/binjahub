[project]
name = "binjahub"
version = "0.1.0"
description = ""
authors = [{ name = "matteyeux", email = "mathieu.hautebas@gmail.com" }]
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "uvicorn>=0.21.1,<0.22",
    "fastapi>=0.95.0,<0.96",
    "python-multipart>=0.0.6,<0.0.7",
    "ldap3>=2.9.1,<3",
    "pyjwt[crypto]>=2.8.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.scripts]
oracle = "binjahub.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "requests>=2.32.5",
    "ruff>=0.13.2",
    "types-requests>=2.32.4.20250913",
]

[tool.mypy]
ignore_missing_imports = true
